name: Daily RailReady news update
on:
  schedule:
    - cron: '30 1 * * *' # 07:00 IST (UTC+05:30); GitHub may delay scheduled jobs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-railready-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect recent news headlines
        run: python scripts/update_news.py
      - name: Commit changes if any
        run: |
          git config user.name "railready-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily current affairs headlines"
            git push
          fi
