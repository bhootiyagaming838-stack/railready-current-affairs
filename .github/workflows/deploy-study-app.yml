name: Deploy RailReady Complete Study App
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - 'scripts/generate_icons.py'
      - 'data/**'
      - 'scripts/validate_study_content.py'
      - '.github/workflows/deploy-study-app.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax and study data
        run: |
          node --check app.js
          node --check sw.js
          python scripts/validate_study_content.py
          python -m json.tool data/general-awareness-bank.json >/dev/null
      - name: Generate installable Android icons
        run: python scripts/generate_icons.py
      - name: Package static study app
        run: |
          mkdir -p public/data
          cp index.html app.js app.css manifest.webmanifest icon.svg icon-192.png icon-512.png sw.js public/
          cp data/*.json public/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
