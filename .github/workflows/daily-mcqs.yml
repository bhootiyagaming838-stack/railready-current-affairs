name: Generate RailReady 60 Daily MCQs
on:
  schedule:
    - cron: '45 1 * * *' # 7:15 AM India Standard Time; GitHub scheduling can be delayed
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_daily_mcqs.py'
      - 'scripts/validate_daily_mcqs.py'
      - '.github/workflows/daily-mcqs.yml'
permissions:
  contents: write
concurrency:
  group: railready-generate-mcqs
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout previous daily question sets
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create 60 original new question variations for today (IST)
        run: python scripts/generate_daily_mcqs.py
      - name: Validate the new questions and answer options
        run: python scripts/validate_daily_mcqs.py
      - name: Publish today’s questions to GitHub Pages content
        shell: bash
        run: |
          git config user.name "railready-mcq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-mcqs.json data/daily-history/
          if git diff --cached --quiet; then
            echo "Today's 60 questions are already published"
            exit 0
          fi
          git commit -m "Publish 60 original RRB NTPC daily MCQs"
          git pull --rebase origin main
          git push origin HEAD:main
