name: Generate RailReady 60 Daily MCQs
on:
  schedule:
    - cron: '45 1 * * *' # 7:15 AM India Standard Time; GitHub scheduling can be delayed
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_daily_mcqs.py'
      - 'scripts/validate_daily_mcqs.py'
      - 'scripts/verify_daily_answers.py'
      - 'scripts/test_daily_quiz.cjs'
      - '.github/workflows/daily-mcqs.yml'
permissions:
  contents: write
concurrency:
  group: railready-generate-mcqs
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout previous daily question sets
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create 60 original new question variations for today (IST)
        run: python scripts/generate_daily_mcqs.py
      - name: Validate the new questions and answer options
        run: |
          python scripts/validate_daily_mcqs.py
          python scripts/verify_daily_answers.py
          node scripts/test_daily_quiz.cjs
      - name: Publish today’s questions to GitHub Pages content
        shell: bash
        run: |
          git config user.name "railready-mcq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-mcqs.json data/daily-history/ data/news.json
          if git diff --cached --quiet; then
            echo "Today's 60 questions are already published"
            exit 0
          fi
          git commit -m "Publish 60 original RRB NTPC daily MCQs"
          git pull --rebase origin main
          git push origin HEAD:main

  publish:
    name: Publish today's quiz to GitHub Pages
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch latest published daily bank
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Validate today's bank and generate app icons
        run: |
          python scripts/validate_daily_mcqs.py
          python scripts/verify_daily_answers.py
          node scripts/test_daily_quiz.cjs
          python scripts/generate_icons.py
          node --check app.js
          node --check daily.js
      - name: Stage full study app and daily MCQs
        run: |
          mkdir -p public/data
          cp index.html daily.html daily.js app.js app.css manifest.webmanifest icon.svg icon-192.png icon-512.png sw.js public/
          cp data/*.json public/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
