<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176c55">
<meta name="description" content="60 new original RRB NTPC Maths and Reasoning practice MCQs daily, for free.">
<title>RailReady — Daily New MCQs</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./app.css">
<style>
body{background:#f5f6f1}#app{padding-bottom:25px}.dailyBar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #d9e4da;background:#fffef9}
.dailyBar .brand{font-size:13px}.dailyBar a:not(.brand){font-size:12px;font-weight:700;text-decoration:none}
.dailyWrap{max-width:750px;margin:auto;padding:27px 16px 70px}
.heroDaily{border-radius:22px;background:#176c55;color:white;padding:26px;position:relative;overflow:hidden}
.heroDaily h1{font-family:'Newsreader',Georgia,serif;font-size:clamp(38px,8vw,55px);font-weight:600;line-height:1.05;margin:10px 0}
.heroDaily p{max-width:520px;opacity:.92;font-size:13px}
.heroDaily .caps{color:#e6b657}
.dailyStats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.dailyStats>div{border-radius:12px;padding:12px;background:#fffef912;border:1px solid #ffffff21;text-align:center}
.dailyStats strong{display:block;font-size:25px;color:white}.dailyStats span{font-size:10px;color:#d3e4d7}
.dailyHeader{display:flex;justify-content:space-between;align-items:center;gap:9px}
.dailyHeader h2{font:600 26px 'Newsreader',Georgia,serif;margin:15px 0}
.panel{background:#fffef9;border:1px solid #d9e4da;border-radius:18px;padding:19px;margin:15px 0}
.panel h2{margin:0 0 10px;font-size:18px}.panel p{color:#65756b;font-size:13px;line-height:1.65}
.dailyButtons{display:flex;gap:8px;flex-wrap:wrap}.dailyButtons .btn{flex:1 1 130px}
.quizTitle{font:600 27px/1.15 'Newsreader',Georgia,serif;margin:15px 0 21px}
.answerOption{display:flex;gap:12px;align-items:center;border:1px solid #d9e4da;background:white;border-radius:12px;padding:13px;margin:10px 0;cursor:pointer;width:100%;text-align:left;min-height:51px;font-size:13px}
.answerOption i{font-style:normal;font-weight:800;background:#eff3ed;color:#173329;min-width:30px;min-height:30px;display:grid;place-items:center;border-radius:8px}
.answerOption.selected{border-color:#176c55;background:#e4f1e8}.answerOption.correct{border-color:#45976e;background:#e0f4e5}.answerOption.wrong{border-color:#be6d65;background:#fff1ed}
.answerOption:disabled{cursor:default;opacity:1}.qIndex{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;margin:16px 0}
.qIndex button{border:1px solid #d9e4da;border-radius:8px;min-height:33px;padding:0;background:white;color:#173329;font-size:11px;font-weight:700}
.qIndex button.done{background:#d3eada;border-color:#92bd9d}.qIndex button.active{background:#176c55;color:white;border-color:#176c55}
.promptMeta{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#537665;font-size:12px;margin-bottom:11px}
.explain{background:#e8f3eb;padding:16px;border-radius:12px;color:#315e49;font-size:13px;line-height:1.7;margin:12px 0}
.progressTrack{height:9px;background:#d9e4da;border-radius:30px;overflow:hidden}.progressTrack>div{height:100%;background:#176c55;border-radius:30px}
.smallNote{font-size:11px;color:#6b7c70;margin:10px 0}.bigScore{font:600 52px 'Newsreader',Georgia,serif;color:#176c55;margin:16px 0}
.helpLink{color:#176c55;text-decoration:none;font-weight:800}.alert{padding:12px;border-radius:11px;background:#f5e9d2;color:#785221;margin:12px 0;font-size:12px}
.footerDaily{color:#647569;font-size:11px;text-align:center;margin:30px auto}
button:focus-visible,a:focus-visible{outline:3px solid #e6b657;outline-offset:3px}
@media(max-width:450px){.dailyBar{padding:12px}.dailyWrap{padding:22px 13px}.heroDaily{padding:20px}.dailyStats strong{font-size:21px}.quizTitle{font-size:24px}.qIndex{gap:4px}.qIndex button{min-height:30px;font-size:10px}}
</style>
</head>
<body>
<header class="dailyBar">
<a href="https://railready-ntpc.floot.app/" class="brand"><span class="logo">R</span><span><strong>RailReady</strong><small>DAILY PRACTICE</small></span></a>
<a class="helpLink" href="https://railready-ntpc.floot.app/" target="_blank" rel="noopener noreferrer">Original Floot app ↗</a>
</header>
<main id="app" class="dailyWrap"><div class="boot"><div class="logo">R</div><h1>Loading daily practice…</h1><p>Connecting to your new question bank.</p></div></main>
<script src="./daily.js" defer></script>
</body></html>
